name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -j 2

      - name: Build portable executable
        run: npx tauri build --no-bundle

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/desk-reminder.exe release/DeskReminder.exe -Force

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build custom installer
        shell: pwsh
        run: |
          $env:Path += ";C:\Program Files (x86)\NSIS"
          .\installer\build-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-universal

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib -j 2

      - name: Build universal macOS app
        run: npx tauri build --target universal-apple-darwin

      - name: Collect macOS artifacts
        run: |
          mkdir -p macos-artifacts
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg macos-artifacts/
          ditto -c -k --keepParent src-tauri/target/universal-apple-darwin/release/bundle/macos/DeskReminder.app macos-artifacts/DeskReminder.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos-artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
